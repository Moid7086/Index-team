<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Kinder Horseas - Carrera de Caballos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #D1E9F6;
            min-height: 100%;
        }

        .top-right-corner-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: #e4d8bb;
            border: 2px solid #F1D3CE;
            border-radius: 12px;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            color: #333;
            z-index: 1000;
        }

        .top-right-corner-btn:hover {
            background-color: #d4c8a8;
        }

        .top-left-welcome {
            position: fixed;
            top: 20px;
            left: 20px;
            background-color: #e4d8bb;
            border: 2px solid #F1D3CE;
            border-radius: 12px;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            color: #333;
            z-index: 1000;
        }

        .container {
            max-width: 100%;
            margin: 100px 20px 40px 20px;
            padding: 20px;
            overflow-x: auto;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .add-btn {
            background-color: #006994;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 12px 24px;
            font-size: 1rem;
            cursor: pointer;
        }

        .add-btn:hover {
            background-color: #005077;
        }

        .row-control {
            background-color: #e4d8bb;
            border: 2px solid #F1D3CE;
            border-radius: 12px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .row-control label {
            font-weight: bold;
        }

        .row-control input {
            width: 80px;
            padding: 6px;
            border-radius: 8px;
            border: 1px solid #F1D3CE;
            text-align: center;
        }

        .row-control button {
            background-color: #D1E9F6;
            border: 2px solid #F1D3CE;
            border-radius: 8px;
            padding: 6px 12px;
            cursor: pointer;
        }

        .row-control button:hover {
            background-color: #bdd8e8;
        }

        .table-wrapper {
            overflow-x: auto;
            max-width: 100%;
            border-radius: 12px;
        }

        .horse-table {
            background-color: #0a2e5c;
            border: 5px solid #F1D3CE;
            border-radius: 12px;
            min-width: min-content;
        }

        .table-header {
            display: grid;
            background-color: #1a4a7a;
            border-bottom: 3px solid #F1D3CE;
        }

        .table-header-cell {
            padding: 15px;
            font-weight: bold;
            text-align: center;
            border-right: 1px solid #F1D3CE;
            white-space: nowrap;
            color: white;
        }

        .table-header-cell:last-child {
            border-right: none;
        }

        .horse-row {
            display: grid;
            border-bottom: 1px solid #F1D3CE;
        }

        .horse-row:last-child {
            border-bottom: none;
        }

        /* Force square tiles for position cells and move cell */
        .horse-cell {
            aspect-ratio: 1 / 1;
            padding: 12px;
            text-align: center;
            border-right: 1px solid #F1D3CE;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Green leftmost column - keep rectangular for name */
        .horse-cell:first-child {
            background-color: #4CAF50;
            color: white;
            font-weight: bold;
            text-align: left;
            justify-content: flex-start;
            cursor: pointer;
            aspect-ratio: auto;
            min-width: 180px;
        }

        .horse-cell:first-child:hover {
            background-color: #45a049;
        }

        /* Movement buttons cell */
        .horse-cell:last-child {
            background-color: #F6EACB;
            aspect-ratio: 1 / 1;
        }

        .table-header-cell:first-child {
            aspect-ratio: auto;
        }

        .move-btn {
            background-color: #D1E9F6;
            border: 2px solid #F1D3CE;
            border-radius: 8px;
            padding: 5px 12px;
            margin: 0 3px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .move-btn:hover:not(:disabled) {
            background-color: #bdd8e8;
        }

        .move-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .horse-image {
            width: 50px;
            height: 50px;
            object-fit: contain;
            display: block;
        }

        @media (max-width: 900px) {
            .horse-cell, .table-header-cell {
                font-size: 12px;
                padding: 8px;
            }
            .move-btn {
                padding: 3px 8px;
                font-size: 10px;
            }
            .horse-image {
                width: 30px;
                height: 30px;
            }
            .horse-cell:first-child {
                min-width: 120px;
            }
        }
    </style>
</head>
<body>
    <div class="top-left-welcome">
        Usuario: <span id="userEmailDisplay">Cargando...</span>
    </div>

    <button class="top-right-corner-btn" id="backBtn">Volver</button>

    <div class="container">
        <div class="controls">
            <button class="add-btn" id="addHorseBtn">+ Agregar Caballo</button>
            <div class="row-control">
                <label>Número de carreras (1-25):</label>
                <input type="number" id="rowCount" min="1" max="25" value="5">
                <button id="updateRowsBtn">Actualizar</button>
            </div>
        </div>

        <div class="table-wrapper">
            <div class="horse-table">
                <div class="table-header" id="tableHeader">
                    <!-- Header will be generated dynamically -->
                </div>
                <div id="horsesList">
                    <!-- Horse rows will appear here -->
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="page1.js"></script>
</body>
<!-- Mood Modal -->
<div id="moodModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.7); z-index: 2000; justify-content: center; align-items: center;">
    <div style="background-color: #0a2e5c; border: 5px solid #F1D3CE; border-radius: 12px; padding: 30px; max-width: 500px; width: 90%; text-align: center;">
        <h2 style="color: white; margin-bottom: 20px;">Registrar Asistencia</h2>
        <p id="moodStudentName" style="color: #F1D3CE; margin-bottom: 20px;">Estudiante:</p>
        <div style="display: flex; justify-content: space-around; flex-wrap: wrap; gap: 15px; margin-bottom: 20px;">
            <div class="mood-option" data-mood="1" style="cursor: pointer; text-align: center; padding: 10px; border-radius: 8px; transition: background-color 0.2s;">
                <img id="mood1Img" src="resources/images/mood1.png" alt="muy mal" style="width: 60px; height: 60px;">
                <p style="color: white; margin-top: 5px;">Muy mal</p>
            </div>
            <div class="mood-option" data-mood="2" style="cursor: pointer; text-align: center; padding: 10px; border-radius: 8px; transition: background-color 0.2s;">
                <img id="mood2Img" src="resources/images/mood2.png" alt="mal" style="width: 60px; height: 60px;">
                <p style="color: white; margin-top: 5px;">Mal</p>
            </div>
            <div class="mood-option" data-mood="3" style="cursor: pointer; text-align: center; padding: 10px; border-radius: 8px; transition: background-color 0.2s;">
                <img id="mood3Img" src="resources/images/mood3.png" alt="normal" style="width: 60px; height: 60px;">
                <p style="color: white; margin-top: 5px;">Normal</p>
            </div>
            <div class="mood-option" data-mood="4" style="cursor: pointer; text-align: center; padding: 10px; border-radius: 8px; transition: background-color 0.2s;">
                <img id="mood4Img" src="resources/images/mood4.png" alt="bien" style="width: 60px; height: 60px;">
                <p style="color: white; margin-top: 5px;">Bien</p>
            </div>
            <div class="mood-option" data-mood="5" style="cursor: pointer; text-align: center; padding: 10px; border-radius: 8px; transition: background-color 0.2s;">
                <img id="mood5Img" src="resources/images/mood5.png" alt="excelente" style="width: 60px; height: 60px;">
                <p style="color: white; margin-top: 5px;">Excelente</p>
            </div>
        </div>
        <button id="closeModalBtn" style="background-color: #e4d8bb; border: 2px solid #F1D3CE; border-radius: 8px; padding: 10px 20px; cursor: pointer;">Cancelar</button>
    </div>
</div>
</html>
