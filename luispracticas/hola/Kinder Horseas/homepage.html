<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Kinder Horseas - Inicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #D1E9F6;
            min-height: 100%;
            position: relative;
        }

        .bubble-left {
    position: fixed;
    left: 20px;
    top: 50%;
    transform: translateY(-50%);
    width: 250px;
    height: auto;
    z-index: 100; 
    pointer-events: none;
}

.bubble-right {
    position: fixed;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    width: 250px;
    height: auto;
    z-index: 100; 
    pointer-events: none;
}

        .top-right-corner-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: #e4d8bb;
            border: 2px solid #F1D3CE;
            border-radius: 12px;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            color: #333;
            z-index: 1000;
        }

        .top-right-corner-btn:hover {
            background-color: #d4c8a8;
        }

        /* Top left welcome message */
        .top-left-welcome {
            position: fixed;
            top: 20px;
            left: 20px;
            background-color: #e4d8bb;
            border: 2px solid #F1D3CE;
            border-radius: 12px;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            color: #333;
            z-index: 1000;
        }

        .bg {
            background-size: 100%;
            min-height: 100%;
            min-width: 100%;
            justify-content: space-between;
            justify-items: center;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            display: flex;
            background-color: #D1E9F6;
            position: relative;
            z-index: 2;
        }

        .formbg {
            border-radius: 5px;
            background-color: #F6EACB;
            padding: 20px;
            border-radius: 8px;
            border: 5px solid #F1D3CE;
            width: 600px;
            max-width: 90%;
            padding: 40px;
            position: relative;
            z-index: 2;
        }

        h1 {
            font-size: 64px;
            font-weight: bold;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin: 30px 0;
        }

        .menu-btn {
            background-color: #e4d8bb;
            border: 2px solid #F1D3CE;
            border-radius: 12px;
            padding: 20px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            color: #333;
        }

        .menu-btn:hover {
            background-color: #d4c8a8;
            transform: scale(1.02);
        }

        .logout-btn {
            display: block;
            width: 150px;
            margin: 20px auto 0;
            padding: 8px 16px;
            font-size: 0.9rem;
            background-color: #D1E9F6;
            border: 2px solid #F1D3CE;
            border-radius: 12px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .logout-btn:hover {
            background-color: #bdd8e8;
        }

        /* Responsive: hide or resize bubbles on small screens */
        @media (max-width: 768px) {
            .bubble-left, .bubble-right {
                width: 120px;
            }
        }

        @media (max-width: 480px) {
            .bubble-left, .bubble-right {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!--izquierda-->
    <img src="HTML/resources/images/bubble-left.png" alt="bubble" class="bubble-left">

    <!-- derecha -->
    <img src="HTML/resources/images/bubble-right.png" alt="bubble" class="bubble-right">

    <div class="top-left-welcome">
        Usuario: <span id="userEmailDisplay">Cargando...</span>
    </div>

    <button class="top-right-corner-btn" id="cuentaBtn">Cuenta</button>

    <div class="bg">
        <div class="formbg">
            <h1>Kinder Horseas</h1>

            <div class="buttons-grid">
                <button class="menu-btn" data-page="page1.html">Opcion 1</button>
                <button class="menu-btn" data-page="page2.html">Opcion 2</button>
                <button class="menu-btn" data-page="page3.html">Opcion 3</button>
                <button class="menu-btn" data-page="page4.html">Opcion 4</button>
                <button class="menu-btn" data-page="page5.html">Opcion 5</button>
                <button class="menu-btn" data-page="page6.html">Opcion 6</button>
            </div>

            <button class="logout-btn" id="logoutBtn">Cerrar Sesion</button>
        </div>
    </div>

    <script type="module" src="homepage.js"></script>
</body>
</html>
