<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Kinder Horseas - Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #041E3A;
            min-height: 100%;
        }

        .top-right-corner-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: #e4d8bb;
            border: 2px solid #F1D3CE;
            border-radius: 12px;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            color: #333;
            z-index: 1000;
        }

        .top-right-corner-btn:hover {
            background-color: #d4c8a8;
        }

        .top-left-welcome {
            position: fixed;
            top: 20px;
            left: 20px;
            background-color: #e4d8bb;
            border: 2px solid #F1D3CE;
            border-radius: 12px;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            color: #333;
            z-index: 1000;
        }

        .container {
            max-width: 900px;
            margin: 100px auto 40px;
            padding: 20px;
        }

        .profile-card {
            background-color: #0a2e5c;
            border: 5px solid #F1D3CE;
            border-radius: 12px;
            padding: 30px;
            color: white;
        }

        .profile-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #F1D3CE;
        }

        .profile-name {
            font-size: 32px;
            font-weight: bold;
        }

        .horse-icon {
            font-size: 48px;
        }

        .section-title {
            font-size: 20px;
            font-weight: bold;
            margin: 25px 0 15px 0;
            color: #F1D3CE;
        }

        /* Notes section */
        .notes-section {
            background-color: #021526;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 25px;
        }

        .notes-textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #F1D3CE;
            background-color: #0a2e5c;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            resize: vertical;
            margin-bottom: 10px;
        }

        .notes-textarea:focus {
            outline: none;
            border-color: #e4d8bb;
        }

        .save-notes-btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 14px;
        }

        .save-notes-btn:hover {
            background-color: #45a049;
        }

        .notes-display {
            background-color: #0a2e5c;
            border-radius: 8px;
            padding: 15px;
            margin-top: 10px;
            min-height: 100px;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .edit-notes-btn {
            background-color: #e4d8bb;
            border: none;
            border-radius: 6px;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 12px;
            margin-left: 10px;
        }

        .edit-notes-btn:hover {
            background-color: #d4c8a8;
        }

        .notes-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .notes-label {
            font-weight: bold;
            color: #F1D3CE;
        }

        /* Mood history section */
        .mood-history {
            background-color: #021526;
            border-radius: 8px;
            overflow-x: auto;
        }

        .mood-table {
            width: 100%;
            border-collapse: collapse;
        }

        .mood-table th, .mood-table td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #F1D3CE;
            color: white;
        }

        .mood-table th {
            background-color: #0a2e5c;
            font-weight: bold;
        }

        .mood-table tr:hover {
            background-color: #0a2e5c;
        }

        .edit-mood-btn {
            background-color: #e4d8bb;
            border: none;
            border-radius: 6px;
            padding: 5px 10px;
            cursor: pointer;
            font-size: 12px;
        }

        .edit-mood-btn:hover {
            background-color: #d4c8a8;
        }

        .mood-img {
            width: 30px;
            height: 30px;
            vertical-align: middle;
        }

        .no-data {
            text-align: center;
            padding: 20px;
            color: #a8c8e8;
        }

        /* Edit mood modal */
        .edit-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.7);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .edit-modal-content {
            background-color: #0a2e5c;
            border: 5px solid #F1D3CE;
            border-radius: 12px;
            padding: 30px;
            max-width: 400px;
            width: 90%;
            text-align: center;
        }

        .edit-modal-content h3 {
            color: white;
            margin-bottom: 20px;
        }

        .edit-mood-options {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 15px;
            margin: 20px 0;
        }

        .edit-mood-option {
            cursor: pointer;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            transition: background-color 0.2s;
        }

        .edit-mood-option:hover {
            background-color: #1a4a7a;
        }

        .edit-mood-option img {
            width: 50px;
            height: 50px;
        }

        .edit-mood-option p {
            color: white;
            margin-top: 5px;
            font-size: 12px;
        }

        .cancel-edit-btn {
            background-color: #e4d8bb;
            border: 2px solid #F1D3CE;
            border-radius: 8px;
            padding: 8px 16px;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Edit notes modal */
        .notes-edit-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.7);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .notes-edit-modal-content {
            background-color: #0a2e5c;
            border: 5px solid #F1D3CE;
            border-radius: 12px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
        }

        .notes-edit-modal-content h3 {
            color: white;
            margin-bottom: 20px;
        }

        .notes-edit-textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #F1D3CE;
            background-color: #021526;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            resize: vertical;
            margin-bottom: 15px;
        }

        .notes-edit-buttons {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .save-notes-edit-btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            cursor: pointer;
        }

        .cancel-notes-edit-btn {
            background-color: #e4d8bb;
            border: 2px solid #F1D3CE;
            border-radius: 8px;
            padding: 8px 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="top-left-welcome">
        Usuario: <span id="userEmailDisplay">Cargando...</span>
    </div>

    <button class="top-right-corner-btn" id="backBtn">Volver</button>

    <div class="container">
        <div class="profile-card">
            <div class="profile-header">
                <div class="profile-name" id="studentName">Cargando...</div>
                <div class="horse-icon">🐴</div>
            </div>

            <!-- Notes Section -->
            <div class="section-title">Notas del Estudiante</div>
            <div class="notes-section">
                <div class="notes-header">
                    <span class="notes-label">Notas:</span>
                    <button class="edit-notes-btn" id="editNotesBtn">Editar Notas</button>
                </div>
                <div class="notes-display" id="notesDisplay">
                    Cargando notas...
                </div>
            </div>

            <!-- Mood History Section -->
            <div class="section-title">Historial de Estado de Ánimo</div>
            <div class="mood-history">
                <table class="mood-table" id="moodTable">
                    <thead>
                        <tr><th>Fecha</th><th>Estado de Ánimo</th><th>Acción</th></tr>
                    </thead>
                    <tbody id="moodHistoryBody">
                        <tr><td colspan="3" class="no-data">Cargando historial...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Edit Mood Modal -->
    <div id="editModal" class="edit-modal">
        <div class="edit-modal-content">
            <h3>Editar Estado de Ánimo</h3>
            <p id="editDate" style="color: #F1D3CE; margin-bottom: 10px;"></p>
            <div class="edit-mood-options">
                <div class="edit-mood-option" data-mood="1">
                    <img src="resources/images/mood1.png" alt="muy mal" onerror="this.outerHTML='😫'">
                    <p>Muy mal</p>
                </div>
                <div class="edit-mood-option" data-mood="2">
                    <img src="resources/images/mood2.png" alt="mal" onerror="this.outerHTML='😞'">
                    <p>Mal</p>
                </div>
                <div class="edit-mood-option" data-mood="3">
                    <img src="resources/images/mood3.png" alt="normal" onerror="this.outerHTML='😐'">
                    <p>Normal</p>
                </div>
                <div class="edit-mood-option" data-mood="4">
                    <img src="resources/images/mood4.png" alt="bien" onerror="this.outerHTML='🙂'">
                    <p>Bien</p>
                </div>
                <div class="edit-mood-option" data-mood="5">
                    <img src="resources/images/mood5.png" alt="excelente" onerror="this.outerHTML='😊'">
                    <p>Excelente</p>
                </div>
            </div>
            <button class="cancel-edit-btn" id="cancelEditBtn">Cancelar</button>
        </div>
    </div>

    <!-- Edit Notes Modal -->
    <div id="notesEditModal" class="notes-edit-modal">
        <div class="notes-edit-modal-content">
            <h3>Editar Notas</h3>
            <textarea id="notesEditTextarea" class="notes-edit-textarea" rows="6" placeholder="Escribe notas sobre el estudiante..."></textarea>
            <div class="notes-edit-buttons">
                <button class="cancel-notes-edit-btn" id="cancelNotesEditBtn">Cancelar</button>
                <button class="save-notes-edit-btn" id="saveNotesEditBtn">Guardar</button>
            </div>
        </div>
    </div>

    <script type="module" src="profile.js"></script>
</body>
</html>
